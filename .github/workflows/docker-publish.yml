name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Compiles everything before we spend time on 4 docker builds. lint/test
  # are no-ops until the project has actual eslint config / spec files -
  # they're wired in now so adding either later just starts working.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # prisma generate only needs a syntactically valid url, not a live database
      - name: Generate prisma clients
        env:
          AUTH_DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=auth
          EVENTS_DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=events
          NOTIFY_DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=notify
        run: |
          for s in auth-service events-service notification-service; do
            npm run prisma:generate -w "apps/$s"
          done

      - run: npx nx run-many --target=lint --all
      - run: npx nx run-many --target=test --all
      - run: npx nx run-many --target=build --all

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: apps/gateway/Dockerfile
          - service: auth-service
            dockerfile: apps/auth-service/Dockerfile
          - service: events-service
            dockerfile: apps/events-service/Dockerfile
          - service: notification-service
            dockerfile: apps/notification-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/somnog-ems-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/somnog-ems-${{ matrix.service }}:${{ github.sha }}

  # All 4 images share one tag (this commit's sha), so the config repo only
  # needs one line bumped, once, after every service has finished building.
  update-config-repo:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ak004/somnog-config-repo
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Bump BACKEND_IMAGE_TAG and push
        run: |
          sed -i "s/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=${{ github.sha }}/" images.env
          git config user.name "somnog-ci"
          git config user.email "ci@somnog.local"
          git commit -am "deploy: backend @ ${{ github.sha }}"
          git push
