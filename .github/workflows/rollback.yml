name: Rollback backend deploy

# Manual only - never runs on push. Points the config repo's
# BACKEND_IMAGE_TAG back at an image that was already built and pushed by a
# previous run of "Build and push images"; nothing gets rebuilt.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit sha to roll back to (the tag on an existing ghcr.io image, e.g. from images.env history)'
        required: true

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Make sure that sha was actually built and pushed
        run: |
          for s in gateway auth-service events-service notification-service; do
            docker manifest inspect "ghcr.io/${{ github.repository_owner }}/somnog-ems-$s:${{ inputs.sha }}" > /dev/null
          done

      - uses: actions/checkout@v4
        with:
          repository: ak004/somnog-config-repo
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Point BACKEND_IMAGE_TAG at the rollback sha and push
        run: |
          sed -i "s/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=${{ inputs.sha }}/" images.env
          git config user.name "somnog-ci"
          git config user.email "ci@somnog.local"
          git commit -am "rollback: backend -> ${{ inputs.sha }}"
          git push
